<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Tornei')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container">
        <h1>Tornei</h1>
        <form th:action="@{/tornei}" method="get" style="margin-bottom:1.5rem; display:flex; gap:0.5rem;">
            <input type="text" name="search" th:value="${search}" placeholder="Cerca torneo..." style="flex:1; background:var(--bg-secondary); border:1px solid var(--border-color);
                       color:var(--color-text-light); padding:0.6rem 1rem; border-radius:2px;" />
            <button type="submit" class="btn">Cerca</button>
            <a th:if="${search != null}" href="/tornei" class="btn">✕</a>
        </form>

        <div class="card-grid">
            <div th:each="t : ${tornei}" class="card">
                <h3 th:text="${t.nome}">Nome torneo</h3>
                <p th:text="'Anno: ' + ${t.anno}">Anno</p>
                <p th:text="${t.descrizione}">Descrizione</p>
                <br />
                <a th:href="@{/tornei/{id}(id=${t.id})}" class="btn">Dettaglio</a>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(tornei)}">
            <p>Nessun torneo trovato.</p>
        </div>

        <!-- Paginazione -->
        <div th:if="${totalePagine > 1}"
            style="display:flex; justify-content:center; align-items:center; gap:0.5rem; margin-top:2rem; flex-wrap:wrap;">

            <a th:if="${hasPrecedente}" th:href="@{/tornei(page=${paginaCorrente - 1}, search=${search})}" class="btn"
                style="padding:0.4rem 1rem;">← Precedente</a>

            <span th:each="i : ${#numbers.sequence(0, totalePagine - 1)}">
                <a th:href="@{/tornei(page=${i}, search=${search})}" th:text="${i + 1}" class="btn" th:style="${i == paginaCorrente} ?
                       'background:var(--color-gold); color:var(--bg-primary); padding:0.4rem 0.8rem;' :
                       'padding:0.4rem 0.8rem;'">
                </a>
            </span>

            <a th:if="${hasSuccessiva}" th:href="@{/tornei(page=${paginaCorrente + 1}, search=${search})}" class="btn"
                style="padding:0.4rem 1rem;">Successiva →</a>
        </div>
    </div>

    <footer>⚔ Runeterra Football League</footer>
</body>

</html>
