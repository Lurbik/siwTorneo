<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Torneo')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div class="container">
        <h1 th:text="${torneo.nome}">Nome Torneo</h1>
        <p th:text="'Anno: ' + ${torneo.anno}">Anno</p>
        <p th:text="${torneo.descrizione}">Descrizione</p>

        <h2>Squadre partecipanti</h2>
        <div class="card-grid">
            <div th:each="s : ${torneo.squadre}" class="card">
                <h3 th:text="${s.nome}">Squadra</h3>
                <a th:href="@{/squadre/{id}(id=${s.id})}" class="btn">Vedi squadra</a>
            </div>
        </div>

        <h2>Partite</h2>
        <div th:each="p : ${torneo.partite}" class="card">
            <h3>
                <span th:text="${p.squadraCasa.nome}">Casa</span>
                vs
                <span th:text="${p.squadraOspite.nome}">Ospite</span>
            </h3>
            <p th:text="'Data: ' + ${p.dataOra}">Data</p>
            <p th:text="'Stato: ' + ${p.stato}">Stato</p>
            <a th:href="@{/partite/{id}(id=${p.id})}" class="btn">Dettaglio</a>
        </div>

        <br />
        <a href="/tornei" class="btn">← Torna ai tornei</a>

        <div sec:authorize="hasRole('ADMIN')" style="margin-top:1rem; display:flex; gap:0.5rem;">
            <a th:href="@{/admin/tornei/{id}/modifica(id=${torneo.id})}" class="btn">✏ Modifica</a>
            <a th:href="@{/admin/tornei/{id}/elimina(id=${torneo.id})}" class="btn btn-danger">🗑 Elimina</a>
            <a th:href="@{/admin/tornei/{id}/squadre(id=${torneo.id})}" class="btn">⚙ Gestisci Squadre</a>
        </div>
    </div>
    <footer>⚔ Runeterra Football League</footer>
</body>

</html>
