<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <title th:text="${title} + ' — Runeterra FL'">Runeterra FL</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<th:block th:fragment="navbar">
    <nav>
        <a href="/" class="logo">⚔ Runeterra FL</a>
        <ul>
            <li><a href="/tornei">Tornei</a></li>
            <li><a href="/squadre">Squadre</a></li>
            <li><a href="/partite">Partite</a></li>
            <li><a href="/classifica">Classifica</a></li>
            <li><a href="/analisi">Analisi</a></li>
            <li sec:authorize="hasRole('ADMIN')">
                <a href="/admin">Admin</a>
            </li>
            <li sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post" style="display:inline">
                    <button type="submit" class="btn" style="padding: 0.3rem 1rem">Logout</button>
                </form>
            </li>
            <li sec:authorize="isAnonymous()">
                <a href="/login" class="btn" style="padding: 0.3rem 1rem">Login</a>
            </li>
        </ul>
    </nav>
</th:block>

<th:block th:fragment="navbar-public">
    <nav>
        <a href="/" class="logo">⚔ Runeterra FL</a>
        <ul>
            <li><a href="/tornei">Tornei</a></li>
            <li><a href="/squadre">Squadre</a></li>
            <li><a href="/partite">Partite</a></li>
            <li><a href="/classifica">Classifica</a></li>
            <li><a href="/analisi">Analisi</a></li>
            <li><a href="/login" class="btn" style="padding: 0.3rem 1rem">Accedi</a></li>
        </ul>
    </nav>
</th:block>

</html>
