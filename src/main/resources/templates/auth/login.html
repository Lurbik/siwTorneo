<!-- login.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <title>Login — Runeterra FL</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
    <nav>
        <a href="/" class="logo">⚔ Runeterra FL</a>
        <ul>
            <li><a href="/tornei">Tornei</a></li>
            <li><a href="/squadre">Squadre</a></li>
            <li><a href="/partite">Partite</a></li>
            <li><a href="/" class="btn" style="padding: 0.3rem 1rem">Annulla</a></li>
        </ul>
    </nav>
    <div class="container">
        <h1>Accedi</h1>
        <div class="form-container">
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" />
                </div>
                <button type="submit" class="btn">Accedi</button>
            </form>
            <p th:if="${param.error}" style="color: #8b0000; margin-top: 1rem;">
                ⚠ Credenziali errate
            </p>
            <p th:if="${param.logout}" style="color: var(--ionia); margin-top: 1rem;">
                ✓ Logout effettuato
            </p>
            <br />
            <a href="/register">Non hai un account? Registrati</a>
        </div>
    </div>

    <footer>⚔ Runeterra Football League</footer>
</body>

</html>
