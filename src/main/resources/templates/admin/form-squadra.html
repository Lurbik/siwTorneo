<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Squadra')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div class="container">
        <h1 th:text="${squadra.id != null} ? 'Modifica Squadra' : 'Crea Squadra'">Squadra</h1>
        <div class="form-container">
            <form
                th:action="${squadra.id != null} ? @{/admin/squadre/{id}/modifica(id=${squadra.id})} : @{/admin/squadre/salva}"
                th:object="${squadra}" method="post" enctype="multipart/form-data">

                <div th:if="${#fields.hasAnyErrors()}" style="background:rgba(139,0,0,0.2); border:1px solid var(--noxus);
                            border-radius:4px; padding:1rem; margin-bottom:1rem;">
                    <p style="color:var(--noxus); font-weight:bold; margin-bottom:0.5rem;">⚠ Correggi i seguenti errori:
                    </p>
                    <ul style="color:var(--color-text-light); padding-left:1.5rem;">
                        <li th:each="err : ${#fields.allErrors()}" th:text="${err}">Errore</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" th:field="*{nome}"
                        th:classappend="${#fields.hasErrors('nome')} ? 'error-field' : ''" />
                    <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"
                        style="color:var(--noxus); font-size:0.8rem; display:block; margin-top:0.3rem;"></span>
                </div>
                <div class="form-group">
                    <label>Anno Fondazione</label>
                    <input type="number" th:field="*{annoFondazione}"
                        th:classappend="${#fields.hasErrors('annoFondazione')} ? 'error-field' : ''" />
                    <span th:if="${#fields.hasErrors('annoFondazione')}" th:errors="*{annoFondazione}"
                        style="color:var(--noxus); font-size:0.8rem; display:block; margin-top:0.3rem;"></span>
                </div>
                <div class="form-group">
                    <label>Città</label>
                    <input type="text" th:field="*{citta}"
                        th:classappend="${#fields.hasErrors('citta')} ? 'error-field' : ''" />
                    <span th:if="${#fields.hasErrors('citta')}" th:errors="*{citta}"
                        style="color:var(--noxus); font-size:0.8rem; display:block; margin-top:0.3rem;"></span>
                </div>

                <!-- LOGO SQUADRA -->
                <div class="form-group">
                    <label>Logo squadra (opzionale)</label>
                    <div th:if="${squadra.immagine != null}" style="margin-bottom:0.8rem;">
                        <img th:src="@{/uploads/{img}(img=${squadra.immagine})}"
                            style="max-width:150px; border:1px solid var(--border-color); border-radius:4px;" />
                    </div>
                    <label for="immagineInput" style="display:flex; align-items:center; gap:0.8rem; cursor:pointer;
                           padding:0.8rem 1rem; background:var(--bg-secondary); border:1px solid var(--border-color);
                           border-radius:4px; transition:border-color 0.2s; color:var(--color-text);"
                        onmouseover="this.style.borderColor='var(--color-gold)'"
                        onmouseout="this.style.borderColor='var(--border-color)'">
                        <span style="font-size:1.5rem;">🖼</span>
                        <span id="nomeFile">Clicca per selezionare il logo...</span>
                    </label>
                    <input type="file" id="immagineInput" name="immagine" accept="image/*" style="display:none"
                        onchange="document.getElementById('nomeFile').textContent = this.files[0]?.name || 'Clicca per selezionare...'" />
                </div>

                <!-- MAGLIETTA -->
                <div class="form-group">
                    <label>Maglietta (opzionale)</label>
                    <div th:if="${squadra.maglietta != null}" style="margin-bottom:0.8rem;">
                        <img th:src="@{/uploads/{img}(img=${squadra.maglietta})}"
                            style="max-width:150px; border:1px solid var(--border-color); border-radius:4px;" />
                    </div>
                    <label for="magliettaInput" style="display:flex; align-items:center; gap:0.8rem; cursor:pointer;
                           padding:0.8rem 1rem; background:var(--bg-secondary); border:1px solid var(--border-color);
                           border-radius:4px; transition:border-color 0.2s; color:var(--color-text);"
                        onmouseover="this.style.borderColor='var(--color-gold)'"
                        onmouseout="this.style.borderColor='var(--border-color)'">
                        <span style="font-size:1.5rem;">👕</span>
                        <span id="nomeMaglietta">Clicca per selezionare la maglietta...</span>
                    </label>
                    <input type="file" id="magliettaInput" name="maglietta" accept="image/*" style="display:none"
                        onchange="document.getElementById('nomeMaglietta').textContent = this.files[0]?.name || 'Clicca per selezionare...'" />
                </div>

                <button type="submit" class="btn"
                    th:text="${squadra.id != null} ? 'Salva modifiche' : 'Crea'">Salva</button>
            </form>
            <br />
            <a href="/admin" class="btn">← Dashboard</a>
        </div>
    </div>
    <footer>⚔ Runeterra Football League</footer>
</body>

</html>
