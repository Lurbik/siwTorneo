<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Giocatore')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div class="container">
        <h1 th:text="${giocatore.id != null} ? 'Modifica Giocatore' : 'Crea Giocatore'">Giocatore</h1>
        <div class="form-container">
            <form
                th:action="${giocatore.id != null} ? @{/admin/giocatori/{id}/modifica(id=${giocatore.id})} : @{/admin/giocatori/salva}"
                th:object="${giocatore}" method="post">

                <!-- Errori globali -->
                <div th:if="${#fields.hasAnyErrors()}" style="background:rgba(139,0,0,0.2); border:1px solid var(--noxus);
                            border-radius:4px; padding:1rem; margin-bottom:1rem;">
                    <p style="color:var(--noxus); font-weight:bold; margin-bottom:0.5rem;">⚠ Correggi i seguenti errori:
                    </p>
                    <ul style="color:var(--color-text-light); padding-left:1.5rem;">
                        <li th:each="err : ${#fields.allErrors()}" th:text="${err}">Errore</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" th:field="*{nome}"
                        th:classappend="${#fields.hasErrors('nome')} ? 'error-field' : ''" />
                    <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"
                        style="color:var(--noxus); font-size:0.8rem; display:block; margin-top:0.3rem;"></span>
                </div>

                <div class="form-group">
                    <label>Cognome</label>
                    <input type="text" th:field="*{cognome}"
                        th:classappend="${#fields.hasErrors('cognome')} ? 'error-field' : ''" />
                    <span th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}"
                        style="color:var(--noxus); font-size:0.8rem; display:block; margin-top:0.3rem;"></span>
                </div>

                <div class="form-group">
                    <label>Data Nascita</label>
                    <input type="date" name="dataNascita" th:value="${giocatore.dataNascita}" />
                </div>

                <div class="form-group">
                    <label>Altezza (cm)</label>
                    <input type="number" th:field="*{altezza}"
                        th:classappend="${#fields.hasErrors('altezza')} ? 'error-field' : ''" />
                    <span th:if="${#fields.hasErrors('altezza')}" th:errors="*{altezza}"
                        style="color:var(--noxus); font-size:0.8rem; display:block; margin-top:0.3rem;"></span>
                </div>

                <div class="form-group">
                    <label>Ruolo</label>
                    <select th:field="*{ruolo}">
                        <option th:each="r : ${ruoli}" th:value="${r}" th:text="${r}">Ruolo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Squadra</label>
                    <select name="squadraId">
                        <option value="" disabled
                            th:selected="${squadraIdSelezionata == null and giocatore.squadra == null}">
                            — Seleziona squadra —
                        </option>
                        <option th:each="s : ${squadre}" th:value="${s.id}" th:text="${s.nome}"
                            th:selected="${squadraIdSelezionata != null} ? ${squadraIdSelezionata == s.id} : ${giocatore.squadra != null and giocatore.squadra.id == s.id}">
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn"
                    th:text="${giocatore.id != null} ? 'Salva modifiche' : 'Crea'">Salva</button>
            </form>
            <br />
            <a href="/admin" class="btn">← Dashboard</a>
        </div>
    </div>
    <footer>⚔ Runeterra Football League</footer>
</body>

</html>
