<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Partite')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container">
        <h1>Partite</h1>
        <div th:each="p : ${partite}" class="card">
            <h3>
                <span th:text="${p.squadraCasa.nome}">Casa</span>
                vs
                <span th:text="${p.squadraOspite.nome}">Ospite</span>
            </h3>
            <p th:text="'Data: ' + ${p.dataOra}">Data</p>
            <p th:text="'Luogo: ' + ${p.luogo}">Luogo</p>
            <p th:text="'Stato: ' + ${p.stato}">Stato</p>
            <br />
            <a th:href="@{/partite/{id}(id=${p.id})}" class="btn">Dettaglio</a>
        </div>
        <div th:if="${#lists.isEmpty(partite)}">
            <p>Nessuna partita disponibile.</p>
        </div>
        <!-- Paginazione -->
        <div th:if="${totalePagine > 1}"
            style="display:flex; justify-content:center; align-items:center; gap:0.5rem; margin-top:2rem;">

            <a th:if="${hasPrecedente}" th:href="@{/partite(page=${paginaCorrente - 1})}" class="btn"
                style="padding:0.4rem 1rem;">← Precedente</a>

            <span th:each="i : ${#numbers.sequence(0, totalePagine - 1)}">
                <a th:href="@{/partite(page=${i})}" th:text="${i + 1}" class="btn"
                    th:style="${i == paginaCorrente} ? 'background:var(--color-gold); color:var(--bg-primary); padding:0.4rem 0.8rem;' : 'padding:0.4rem 0.8rem;'">
                </a>
            </span>

            <a th:if="${hasSuccessiva}" th:href="@{/partite(page=${paginaCorrente + 1})}" class="btn"
                style="padding:0.4rem 1rem;">Successiva →</a>
        </div>
    </div>

    <footer>⚔ Runeterra Football League</footer>
</body>

</html>
