<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Errore')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div class="container" style="text-align:center; padding-top:4rem;">

        <div style="font-size:5rem; margin-bottom:1rem;">⚔</div>

        <h1 th:text="${status}">Errore</h1>

        <p style="color:var(--color-text); font-size:1.1rem; margin-bottom:2rem;" th:text="${status == 404} ? 'Questa pagina non esiste in nessuna regione di Runeterra.' :
                    ${status == 403} ? 'Non hai i permessi per accedere a questa area.' :
                    'Qualcosa è andato storto. Anche i campioni a volte falliscono.'">
        </p>

        <div style="display:flex; gap:1rem; justify-content:center;">
            <a href="/" class="btn">🏠 Torna alla Home</a>
            <a href="javascript:history.back()" class="btn">← Torna indietro</a>
        </div>
    </div>
    <footer>⚔ Runeterra Football League</footer>
</body>

</html>
